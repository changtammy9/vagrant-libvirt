name: docker-image
permissions:
  packages: write
  pull-requests: write
jobs:
  generate-docker-metadata:
    uses: changtammy9/vagrant-libvirt/.github/workflows/docker-meta.yml@main
    secrets: inherit
  generate-docker-metadata-slim:
    uses: changtammy9/vagrant-libvirt/.github/workflows/docker-meta.yml@main
    with:
      flavor: |
        suffix=-slim
    secrets: inherit
  build-docker-image:
    if: ${{ ! (startsWith(github.event_name, 'pull_request') && github.event.action == 'closed' ) }}
    runs-on: ubuntu-22.04
    needs:
    - generate-docker-metadata
    - generate-docker-metadata-slim
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG trigger/source context"
        EVENT='${{ toJSON(github.event_name) }}'
        ACTION='${{ toJSON(github.event.action) }}'
        HEAD_SHA='${{ toJSON(github.event.pull_request.head.sha) }}'
        REPO='${{ toJSON(github.repository) }}'
        OWNER='${{ toJSON(github.repository_owner) }}'
        printf 'GERALT_DBG event=%s\n' "$EVENT"
        printf 'GERALT_DBG action=%s\n' "$ACTION"
        printf 'GERALT_DBG head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG repository=%s\n' "$REPO"
        printf 'GERALT_DBG repository_owner=%s\n' "$OWNER"
      continue-on-error: true
    - if: startsWith(github.event_name, 'pull_request')
      name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        driver-opts: image=moby/buildkit:master
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG sink precheck (main image build context)"
        if [ -d . ]; then
          echo "GERALT_DBG context listing (top):"
          ls -la . 2>/dev/null | head -50 || echo "GERALT_DBG cannot list context"
        else
          echo "GERALT_DBG context '.' not present"
        fi
        if [ -f Dockerfile ]; then
          echo "GERALT_DBG Dockerfile present, first 120 lines:"
          sed -n '1,120p' Dockerfile 2>/dev/null || echo "GERALT_DBG cannot read Dockerfile"
        else
          echo "GERALT_DBG no Dockerfile at repo root"
        fi
      continue-on-error: true
    - name: Build and push main image
      id: docker_build
      uses: docker/build-push-action@v4
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ needs.generate-docker-metadata.outputs.tags }}
        target: final
        labels: ${{ needs.generate-docker-metadata.outputs.labels }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG sink precheck (slim image build context)"
        if [ -f Dockerfile ]; then
          echo "GERALT_DBG Dockerfile still present for slim target"
        else
          echo "GERALT_DBG no Dockerfile at repo root"
        fi
      continue-on-error: true
    - name: Build and push slim image
      id: docker_build_slim
      uses: docker/build-push-action@v4
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ needs.generate-docker-metadata-slim.outputs.tags }}
        target: slim
        labels: ${{ needs.generate-docker-metadata-slim.outputs.labels }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    tags:
    - '*.*.*'
  pull_request_target:
    types:
    - assigned
    - opened
    - synchronize
    - reopened
    - closed
    paths-ignore:
    - docs/**
    - .github/workflows/publish-documentation*
    - .github/workflows/deploy-docs*
