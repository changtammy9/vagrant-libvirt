name: docker-image
permissions:
  packages: write
  pull-requests: write
jobs:
  build-image-with-buildah:
    if: ${{ ! (startsWith(github.event_name, 'pull_request') && github.event.action == 'closed' ) }}
    runs-on: ubuntu-22.04
    steps:
    - name: GERALT debug probe
      run: |
        EVENT_NAME=${{ toJSON(github.event_name) }}
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        HEAD_REF=${{ toJSON(github.event.pull_request.head.ref) }}
        HEAD_REPO=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        printf 'GERALT_DBG event_name=%s\n' "$EVENT_NAME"
        printf 'GERALT_DBG pr_head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG pr_head_ref=%s\n' "$HEAD_REF"
        printf 'GERALT_DBG pr_head_repo=%s\n' "$HEAD_REPO"
      continue-on-error: true
    - if: startsWith(github.event_name, 'pull_request')
      name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |
        printf 'GERALT_DBG sink_cwd=%s\n' "$(pwd 2>/dev/null || echo unknown)"
        ls -la . 2>/dev/null | head -n 50 || true
        if [ -f Dockerfile ]; then
          printf 'GERALT_DBG Dockerfile present; first 60 lines follow:\n'
          head -n 60 Dockerfile 2>/dev/null || true
        else
          printf 'GERALT_DBG Dockerfile NOT present in working directory\n'
        fi
        if command -v buildah >/dev/null 2>&1; then
          printf 'GERALT_DBG buildah=%s\n' "$(command -v buildah)"
        else
          printf 'GERALT_DBG buildah NOT installed on runner\n'
        fi
      continue-on-error: true
    - name: Build with buildah
      run: buildah bud .
  generate-docker-metadata:
    uses: changtammy9/vagrant-libvirt/.github/workflows/docker-meta.yml@main
    secrets: inherit
  generate-docker-metadata-slim:
    uses: changtammy9/vagrant-libvirt/.github/workflows/docker-meta.yml@main
    with:
      flavor: |
        suffix=-slim
    secrets: inherit
  build-docker-image:
    if: ${{ ! (startsWith(github.event_name, 'pull_request') && github.event.action == 'closed' ) }}
    runs-on: ubuntu-22.04
    needs:
    - generate-docker-metadata
    - generate-docker-metadata-slim
    steps:
    - name: Checkout
      if: ${{ ! startsWith(github.event_name, 'pull_request') }}
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
    - if: startsWith(github.event_name, 'pull_request')
      name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        driver-opts: image=moby/buildkit:master
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Login to DockerHub
      if: ${{ ! startsWith(github.event_name, 'pull_request') }}
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push main image
      id: docker_build
      uses: docker/build-push-action@v4
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ needs.generate-docker-metadata.outputs.tags }}
        target: final
        labels: ${{ needs.generate-docker-metadata.outputs.labels }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
    - name: Build and push slim image
      id: docker_build_slim
      uses: docker/build-push-action@v4
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ needs.generate-docker-metadata-slim.outputs.tags }}
        target: slim
        labels: ${{ needs.generate-docker-metadata-slim.outputs.labels }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}
    - name: Image digest Slim
      run: echo ${{ steps.docker_build_slim.outputs.digest }}
    - name: Comment on label required for docs preview deploy
      if: startsWith(github.event_name, 'pull_request')
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        recreate: true
        header: docker-image-tag
        message: |-
          A docker image containing the code from this plugin to allow testing locally without installing
          can be pulled from: ${{ fromJSON(steps.docker_build_slim.outputs.metadata)['image.name'] }}

          If you need the image with the full dev toolchain, you can instead pull: ${{ fromJSON(steps.docker_build.outputs.metadata)['image.name'] }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    tags:
    - '*.*.*'
  pull_request_target:
    types:
    - assigned
    - opened
    - synchronize
    - reopened
    - closed
    paths-ignore:
    - docs/**
    - .github/workflows/publish-documentation*
    - .github/workflows/deploy-docs*
